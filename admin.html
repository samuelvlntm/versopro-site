<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de licenças · VersoPro</title><link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="estilo.css"><link rel="stylesheet" href="pagina.css"><meta name="robots" content="noindex,nofollow"></head>
<body><div class="cx larga">
<div class="cab"><img src="img/logo.png" alt=""><span>Painel de licenças</span></div>
<div id="login"><label for="s">Senha do painel (ADMIN_SENHA do Netlify)</label><input id="s" type="password"><button class="b" id="ent" style="max-width:240px">Entrar</button></div>
<div id="pn" hidden>
<p class="sub" id="tot"></p>
<div class="linha"><input id="bus" placeholder="Procurar por e-mail, nome, chave ou pedido"></div>
<details style="margin-top:14px"><summary style="cursor:pointer">Criar chave manual (cortesia, venda por fora)</summary>
<div class="linha"><div><label>Nome da igreja / pessoa</label><input id="cn"></div><div><label>E-mail</label><input id="ce" type="email"></div><div><label>PCs</label><input id="cl" type="number" value="2" min="1"></div></div>
<button class="b" id="cr" style="max-width:240px">Criar chave</button></details>
<table><thead><tr><th>Cliente</th><th>Chave</th><th>Pedido</th><th>PCs</th><th>Situação</th><th></th></tr></thead><tbody id="tb"></tbody></table>
</div>
<div class="msg" id="m"></div>
</div>
<script>
(function(){var S="",L=[],$=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(o){o.senha=S;return fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).then(function(r){return r.text().then(function(t){try{return JSON.parse(t)}catch(e){return{ok:false,erro:r.status==404?"O servidor de licenças não está no ar (erro 404). O site precisa ser publicado pelo GitHub, não pelo Netlify Drop.":"Erro "+r.status+" no servidor."}}})})}
function msg(t,e){$("m").className="msg"+(e?" err":"");$("m").textContent=t||""}
function dt(s){try{return new Date(s).toLocaleString("pt-BR")}catch(e){return s}}
function pinta(){var q=$("bus").value.trim().toLowerCase(),l=L.filter(function(x){return!q||[x.email,x.nome,x.chave,x.pedido].join(" ").toLowerCase().indexOf(q)>=0});
$("tot").textContent=L.length+" licenças · "+L.filter(function(x){return x.status=="ativa"}).length+" ativas";
$("tb").innerHTML=l.map(function(x){return"<tr><td><b>"+esc(x.nome||"(sem nome)")+"</b><br>"+esc(x.email)+"<br><small>"+dt(x.criada)+"</small></td><td><code>"+esc(x.chave)+"</code></td><td>"+esc(x.pedido)+"<br><small>"+esc(x.origem)+"</small></td><td>"+x.inst.length+" de "+x.limite+(x.inst.length?"<br><small>"+x.inst.map(function(i){return esc(i.nome)}).join("<br>")+"</small>":"")+"</td><td class=\"st-"+x.status+"\">"+x.status+"</td><td>"+
(x.status=="ativa"?'<button class="mini" data-a="cancelar" data-k="'+x.chave+'">Cancelar</button>':'<button class="mini" data-a="reativar" data-k="'+x.chave+'">Reativar</button>')+
'<button class="mini" data-a="liberarPcs" data-k="'+x.chave+'" title="Use quando o cliente perdeu o PC e não consegue desativar">Liberar PCs</button><button class="mini" data-a="limite" data-k="'+x.chave+'">Mudar nº de PCs</button></td></tr>"}).join("")}
function carrega(){msg("Carregando…");api({acao:"listar"}).then(function(d){if(!d.ok){msg(d.erro,1);$("login").hidden=false;$("pn").hidden=true;return}L=d.lista;$("login").hidden=true;$("pn").hidden=false;msg("");pinta()}).catch(function(){msg("Sem conexão.",1)})}
$("ent").onclick=function(){S=$("s").value.trim();carrega()};$("s").onkeydown=function(e){if(e.key=="Enter")$("ent").click()};
$("bus").oninput=pinta;
$("cr").onclick=function(){api({acao:"criar",nome:$("cn").value,email:$("ce").value,limite:$("cl").value}).then(function(d){if(d.ok){msg("Chave criada: "+d.lic.chave);carrega()}else msg(d.erro,1)})};
$("tb").onclick=function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.a,o={acao:a,chave:b.dataset.k};
if(a=="cancelar"&&!confirm("Cancelar esta licença? O programa do cliente para de aceitar a chave (depois de 30 dias de carência)."))return;
if(a=="liberarPcs"&&!confirm("Liberar todas as vagas de PC desta chave? Os PCs atuais vão pedir a chave de novo depois da carência."))return;
if(a=="limite"){var n=prompt("Quantos computadores esta chave pode usar?","2");if(!n)return;o.limite=n}
api(o).then(function(d){if(d.ok){msg("Feito.");carrega()}else msg(d.erro,1)})}})();
</script></body></html>

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# App Android (VersoPro Mobile): link fixo
[[redirects]]
  from = "/baixar-android"
  to = "/app/VersoPro-Mobile.apk"
  status = 302

[[headers]]
  for = "/app/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=VersoPro-Mobile.apk"
